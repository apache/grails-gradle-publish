buildscript {
    repositories {
        maven { url = System.getenv('LOCAL_MAVEN_PATH') }
        maven { url = 'https://repo.grails.org/grails/restricted' }
    }
    dependencies {
        classpath "org.apache.grails.gradle:grails-publish:$grailsGradlePluginVersion"
    }
}

allprojects {
    repositories {
        maven { url = 'https://repo.grails.org/grails/restricted' }
    }
}

version = projectVersion
group = 'org.grails.example'

apply plugin: 'java-library'
apply plugin: 'groovy'

dependencies {
    implementation "org.apache.groovy:groovy:$groovyVersion"
}

// the java-gradle-plugin creates its own pluginMaven publication, which must be reused in either plugin order
if (System.getenv('APPLY_JAVA_GRADLE_PLUGIN_FIRST')) {
    apply plugin: 'java-gradle-plugin'
}
apply plugin: 'org.apache.grails.gradle.grails-publish'
if (!System.getenv('APPLY_JAVA_GRADLE_PLUGIN_FIRST')) {
    apply plugin: 'java-gradle-plugin'
}

gradlePlugin {
    plugins {
        example {
            id = 'org.grails.example.gradle-plugin-project'
            implementationClass = 'org.grails.example.MyProject'
        }
    }
}

grailsPublish {
    githubSlug = 'apache/grails-cores'
    license {
        name = 'Apache-2.0'
    }
    title = 'Grails Gradle Plugin - Example Project'
    desc = 'A testing project for the grails gradle plugin'
    developers = [
            jdaugherty: 'James Daugherty',
    ]
}

// publish the artifacts through a second publication as well, so the publications share them
if (System.getenv('PUBLISH_SHARED_ARTIFACTS')) {
    grailsPublish {
        publicationName = 'maven'
        addComponents = true
    }
}