buildscript {
    repositories {
        maven { url = System.getenv('LOCAL_MAVEN_PATH') }
        maven { url = 'https://repo.grails.org/grails/restricted' }
    }
    dependencies {
        classpath "org.apache.grails.gradle:grails-publish:$grailsGradlePluginVersion"
    }
}

allprojects {
    repositories {
        maven { url = 'https://repo.grails.org/grails/restricted' }
    }
}

version = projectVersion
group = 'org.grails.example'

apply plugin: 'java-library'
apply plugin: 'groovy'
apply plugin: 'java-test-fixtures'

dependencies {
    // managed by a platform: Gradle's version mapping writes the version of the main variants
    implementation platform("org.apache.groovy:groovy-bom:$groovyVersion")
    implementation 'org.apache.groovy:groovy'

    // only on the test fixtures classpaths, which version mapping does not read: the Grails Publish plugin resolves
    // the version written into the pom and the Gradle module metadata
    testFixturesApi platform("org.apache.groovy:groovy-bom:$groovyVersion")
    // the reject has to survive the version the plugin fills in
    testFixturesApi('org.apache.groovy:groovy-json') {
        version {
            reject '1.0.0'
        }
    }
}

// a dependency from a repository that may not have it yet, see GrailsPublishPluginSpec
if (findProperty('lateRepositoryUrl')) {
    repositories {
        maven { url = findProperty('lateRepositoryUrl') }
    }
    dependencies {
        testFixturesApi 'org.example:late:1.0'
    }
}

apply plugin: 'org.apache.grails.gradle.grails-publish'
grailsPublish {
    githubSlug = 'apache/grails-gradle-publish'
    license {
        name = 'Apache-2.0'
    }
    title = 'Platform Managed Versions'
    desc = 'A project whose dependency versions are managed by a platform'
    developers = [
            jdaugherty: 'James Daugherty',
    ]
    pomCustomization = { xml ->
        xml.asNode().appendNode('inceptionYear', '2025')
    }
}
