// A standalone build (not part of the multi-project build above) that consumes the published artifacts from a
// repository, the way the end-to-end tests of grails-core consume its TestCaseMavenRepo. Run it with
//   -PpublishedRepositoryUrl=<the repository the build was published to> -PpublishedVersion=<the version>
pluginManagement {
    repositories {
        maven {
            name = 'Published'
            url = uri(publishedRepositoryUrl)
        }
        gradlePluginPortal()
    }
    plugins {
        id 'org.grails.example.acme' version "$publishedVersion"
    }
}

dependencyResolutionManagement {
    repositories {
        // only the published modules come from the publish repository
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Published'
                    url = uri(publishedRepositoryUrl)
                }
            }
            filter {
                includeGroup 'org.grails.example'
            }
        }
        mavenCentral()
    }
}

rootProject.name = 'consumer'
