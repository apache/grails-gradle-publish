plugins {
    id 'java-library'
    // resolved through its plugin marker publication
    id 'org.grails.example.acme'
}

dependencies {
    // the BOM manages the framework versions...
    implementation platform("org.grails.example:acme-bom:$publishedVersion")
    // ...so the starter needs none; it brings acme-core and commons-lang3 along
    implementation 'org.grails.example:acme-starter'
    // the test fixtures variant of acme-core, selected by its capability
    testImplementation testFixtures('org.grails.example:acme-core')
}

// always re-check snapshots so a freshly published build is picked up
configurations.configureEach {
    resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
}

tasks.register('resolve') {
    group = 'verification'
    description = 'Prints the resolved runtime and test runtime classpaths.'
    def classpaths = ['runtimeClasspath', 'testCompileClasspath', 'testRuntimeClasspath'].collectEntries {
        [(it): configurations.named(it)]
    }
    doLast {
        classpaths.each { String name, def classpath ->
            println "${name}: ${classpath.get().files*.name.sort()}"
        }
    }
}
