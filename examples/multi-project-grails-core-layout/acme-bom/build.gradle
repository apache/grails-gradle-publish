plugins {
    id 'java-platform'
}

version = projectVersion
group = 'org.grails.example'

repositories {
    mavenCentral()
}

javaPlatform {
    allowDependencies()
}

ext {
    pomTitle = 'Acme BOM'
    pomDescription = 'Bill of materials of the Acme framework'
    // Like the grails-core BOMs, every managed version is replaced by a Maven property reference so consumers can
    // override it (`-Dacme-core.version=...` in Maven, or the property in a Gradle platform import)
    pomCustomization = { xml ->
        def root = xml.asNode()
        def properties = root.properties ? root.properties[0] : root.appendNode('properties')
        root.dependencyManagement.dependencies.dependency.each { dependency ->
            String artifactId = dependency.artifactId.text().trim()
            String version = dependency.version.text().trim()
            if (!version) {
                throw new GradleException("The BOM constraint on ${artifactId} has no version")
            }
            String propertyName = "${artifactId}.version"
            properties.appendNode(propertyName, version)
            dependency.version[0].value = "\${${propertyName}}"
        }
    }
}
apply from: rootProject.layout.projectDirectory.file('gradle/publish-conventions.gradle')

dependencies {
    api platform("org.apache.groovy:groovy-bom:$groovyVersion")

    constraints {
        // the build's own modules...
        api project(':acme-core')
        api project(':acme-starter')
        // ...and third party versions
        api 'org.apache.commons:commons-lang3:3.17.0'
    }
}
