// The Grails Publish plugin (applied by the root project) completes the `pluginMaven` publication that
// java-gradle-plugin creates; nothing needs configuring for the two to share it
plugins {
    id 'groovy'
    id 'java-gradle-plugin'
}

version = projectVersion
group = 'org.grails.example'

repositories {
    mavenCentral()
}

ext {
    pomTitle = 'Acme Gradle Plugin'
    pomDescription = 'The Gradle plugin of the Acme framework'
}
apply from: rootProject.layout.projectDirectory.file('gradle/publish-conventions.gradle')

gradlePlugin {
    plugins {
        acme {
            id = 'org.grails.example.acme'
            implementationClass = 'org.grails.example.acme.gradle.AcmePlugin'
        }
    }
}
