// A dependency-only "starter": no sources, an (almost) empty jar, and a pom that pulls in the framework modules with
// versions resolved from the BOM.
plugins {
    // needed for the dependency configurations
    id 'java-library'
}

version = projectVersion
group = 'org.grails.example'

repositories {
    mavenCentral()
}

ext {
    pomTitle = 'Acme Starter'
    pomDescription = 'Aggregates the Acme framework modules an application needs'
}
apply from: rootProject.layout.projectDirectory.file('gradle/publish-conventions.gradle')

dependencies {
    api platform(project(':acme-bom'))
    api project(':acme-core')
    api 'org.apache.commons:commons-lang3'
}

// There is nothing to document or package as sources; a disabled task drops its artifact from the publication.
// The Grails Publish plugin registers these jars itself once the project is evaluated; registering them here makes
// the tasks available to this build script (this is what the grails-core compile conventions do).
java {
    withSourcesJar()
    withJavadocJar()
}
tasks.named('javadocJar') {
    enabled = false
}
tasks.named('sourcesJar') {
    enabled = false
}
