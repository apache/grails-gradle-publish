plugins {
    id 'java-library'
    id 'groovy'
    // the test fixtures are published as a `test-fixtures` variant (capability acme-core-test-fixtures)
    id 'java-test-fixtures'
}

version = projectVersion
group = 'org.grails.example'

repositories {
    mavenCentral()
}

ext {
    pomTitle = 'Acme Core'
    pomDescription = 'The core module of the Acme framework'
}
apply from: rootProject.layout.projectDirectory.file('gradle/publish-conventions.gradle')

dependencies {
    // dependency versions come from the build's own BOM
    implementation platform(project(':acme-bom'))
    implementation 'org.apache.groovy:groovy'

    testFixturesApi platform(project(':acme-bom'))
    testFixturesApi 'org.apache.commons:commons-lang3'
    testFixturesImplementation 'org.apache.groovy:groovy'
}
