import org.apache.grails.gradle.publish.GrailsPublishGradlePlugin
import org.gradle.api.publish.maven.tasks.AbstractPublishToMaven
import org.gradle.plugins.signing.Sign

// The plugin can be extended. The Grails profile publishing plugin (org.apache.grails.gradle.grails-publish-profile
// in grails-core) is a subclass that publishes the compiled `profile.yml` as an extra artifact with the `profile`
// classifier; this example does the same with a generated descriptor.
plugins {
    id 'java-library'
    id 'groovy'
    // puts the plugin classes on the classpath without applying the plugin
    id 'org.apache.grails.gradle.grails-publish' apply false
}

version = projectVersion
group = 'org.grails.example'

repositories {
    mavenCentral()
}

dependencies {
    implementation "org.apache.groovy:groovy:$groovyVersion"
}

class ProfilePublishPlugin extends GrailsPublishGradlePlugin {

    @Override
    protected Map<String, String> getDefaultExtraArtifact(Project project) {
        [
                source    : project.layout.buildDirectory.file('profile/profile.yml').get().asFile.path,
                classifier: defaultClassifier,
                extension : 'yml',
        ]
    }

    @Override
    protected String getDefaultClassifier() {
        'profile'
    }
}
apply plugin: ProfilePublishPlugin

// Produces the extra artifact; publishing (and signing, for releases) must run after it
def generateProfile = tasks.register('generateProfile') {
    def profile = layout.buildDirectory.file('profile/profile.yml')
    outputs.file(profile)
    doLast {
        profile.get().asFile.text = """\
            name: acme
            version: ${project.version}
            description: An example profile descriptor
            """.stripIndent()
    }
}
tasks.withType(AbstractPublishToMaven).configureEach {
    dependsOn generateProfile
}
pluginManager.withPlugin('signing') {
    tasks.withType(Sign).configureEach {
        dependsOn generateProfile
    }
}

grailsPublish {
    githubSlug = 'apache/grails-gradle-publish'
    license {
        name = 'Apache-2.0'
    }
    title = 'Extended Plugin'
    desc = 'A project published by a subclass of the Grails Publish plugin that adds a profile descriptor artifact'
    developers = [jdaugherty: 'James Daugherty']
}
