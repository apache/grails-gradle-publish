// Dependencies declared without a version, managed by a Gradle platform or by the Spring dependency management
// plugin (as Grails plugins do). The published pom and Gradle module metadata carry the resolved versions, and
// the dependencyManagement section the Spring plugin adds to the pom is removed.
plugins {
    id 'java-library'
    id 'groovy'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.apache.grails.gradle.grails-publish'
}

version = projectVersion
group = 'org.grails.example'

repositories {
    mavenCentral()
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:$springBootVersion"
    }
}

dependencies {
    // managed by a Gradle platform
    implementation platform("org.apache.groovy:groovy-bom:$groovyVersion")
    implementation 'org.apache.groovy:groovy'

    // managed by the Spring Boot BOM through the dependency management plugin
    api 'org.slf4j:slf4j-api'
    implementation 'org.apache.commons:commons-lang3'
}

grailsPublish {
    githubSlug = 'apache/grails-gradle-publish'
    license {
        name = 'Apache-2.0'
    }
    title = 'Managed Dependency Versions'
    desc = 'A library whose dependency versions come from a platform and a BOM'
    developers = [jdaugherty: 'James Daugherty']
}
