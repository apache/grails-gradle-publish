// A Bill of Materials: a `java-platform` project publishes a pom (packaging `pom`) with a dependencyManagement
// section and no jar, sources jar or javadoc jar.
plugins {
    id 'java-platform'
    id 'org.apache.grails.gradle.grails-publish'
}

version = projectVersion
group = 'org.grails.example'

repositories {
    mavenCentral()
}

javaPlatform {
    // required to import other platforms
    allowDependencies()
}

dependencies {
    api platform("org.apache.groovy:groovy-bom:$groovyVersion")

    constraints {
        api 'org.apache.commons:commons-lang3:3.17.0'
        api 'org.apache.commons:commons-text:1.13.0'
    }
}

grailsPublish {
    githubSlug = 'apache/grails-gradle-publish'
    license {
        name = 'Apache-2.0'
    }
    title = 'Example BOM'
    desc = 'A Bill of Materials published with the Grails Publish plugin'
    developers = [jdaugherty: 'James Daugherty']

    // The generated pom can be post-processed; here the Groovy version is exposed as a Maven property. The closure runs
    // when the pom is generated, where the configuration cache gives it no access to the project, so the version is
    // read beforehand into a local variable
    String bomGroovyVersion = groovyVersion
    pomCustomization = { xml ->
        def root = xml.asNode()
        def properties = root.properties ? root.properties[0] : root.appendNode('properties')
        properties.appendNode('groovy.version', bomGroovyVersion)
    }
}
