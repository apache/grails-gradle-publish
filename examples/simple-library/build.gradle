plugins {
    id 'java-library'
    id 'groovy'
    id 'org.apache.grails.gradle.grails-publish'
}

// The version decides whether this build publishes a snapshot or a release
// (unless the GRAILS_PUBLISH_RELEASE environment variable says otherwise)
version = projectVersion
group = 'org.grails.example'

repositories {
    mavenCentral()
}

dependencies {
    implementation "org.apache.groovy:groovy:$groovyVersion"
}

grailsPublish {
    githubSlug = 'apache/grails-gradle-publish'
    license {
        name = 'Apache-2.0'
    }
    title = 'Simple Library'
    desc = 'A Groovy and Java library published with the Grails Publish plugin'
    developers = [jdaugherty: 'James Daugherty']
}

// Releases are signed. To publish an unsigned release (for example to an internal repository)
// run the build with -PskipSigning
if (findProperty('skipSigning')) {
    pluginManager.withPlugin('signing') {
        tasks.withType(Sign).configureEach {
            it.enabled = false
        }
    }
}
