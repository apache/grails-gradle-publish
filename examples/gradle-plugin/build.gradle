// A Gradle plugin published with the Grails Publish plugin (this is how the Grails Gradle plugins are published).
// The java-gradle-plugin adds the java component to a `pluginMaven` publication and creates the plugin marker
// publication; the Grails Publish plugin detects it and completes that same publication with the pom metadata and
// the sources and javadoc jars (`publicationName` defaults to `pluginMaven`, and only adding the java component is
// left to the java-gradle-plugin), in whichever order the two plugins are applied.
plugins {
    id 'groovy'
    id 'java-gradle-plugin'
    id 'org.apache.grails.gradle.grails-publish'
}

version = projectVersion
group = 'org.grails.example'

repositories {
    mavenCentral()
}

gradlePlugin {
    plugins {
        hello {
            id = 'org.grails.example.hello'
            implementationClass = 'org.grails.example.gradle.HelloPlugin'
        }
    }
}

grailsPublish {
    githubSlug = 'apache/grails-gradle-publish'
    license {
        name = 'Apache-2.0'
    }
    title = 'Example Gradle Plugin'
    desc = 'A Gradle plugin published with the Grails Publish plugin'
    developers = [jdaugherty: 'James Daugherty']
}
