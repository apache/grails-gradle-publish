pluginManagement {
    repositories {
        // The examples resolve the plugin from the local Maven repository. Publish it there first,
        // from the root of this repository: ./gradlew publishToMavenLocal
        mavenLocal()
        gradlePluginPortal()
    }
    plugins {
        id 'org.apache.grails.gradle.grails-publish' version "$grailsPublishVersion"
    }
}

rootProject.name = 'multi-project-root-configured'

include 'core'
include 'web'
