// Publishes the compiled test classes as an extra jar with the `tests` classifier, so other projects can
// reuse test support classes (a common pattern for Grails test support modules).
plugins {
    id 'java-library'
    id 'groovy'
    id 'org.apache.grails.gradle.grails-publish'
}

version = projectVersion
group = 'org.grails.example'

repositories {
    mavenCentral()
}

dependencies {
    implementation "org.apache.groovy:groovy:$groovyVersion"

    testImplementation platform('org.spockframework:spock-bom:2.3-groovy-4.0')
    testImplementation 'org.spockframework:spock-core'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

grailsPublish {
    githubSlug = 'apache/grails-gradle-publish'
    license {
        name = 'Apache-2.0'
    }
    title = 'Test Sources'
    desc = 'A library that also publishes its compiled test classes'
    developers = [jdaugherty: 'James Daugherty']

    publishTestSources = true
}
