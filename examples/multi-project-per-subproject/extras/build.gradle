plugins {
    id 'java-library'
    id 'groovy'
    id 'org.apache.grails.gradle.grails-publish'
}

version = projectVersion
group = 'org.grails.example'

repositories {
    mavenCentral()
}

dependencies {
    implementation "org.apache.groovy:groovy:$groovyVersion"
    // project dependencies are published with the version of the referenced project
    api project(':core')
}

grailsPublish {
    githubSlug = 'apache/grails-gradle-publish'
    license {
        name = 'Apache-2.0'
    }
    title = 'Multi Project - extras'
    desc = 'The extras module of a multi-project build published with the Grails Publish plugin'
    developers = [jdaugherty: 'James Daugherty']
}
