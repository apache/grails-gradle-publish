# Maintains one draft GitHub Release per release branch (main, 1.0.x, 1.1.x,
# ...). Each branch produces an independent draft because the release-drafter
# config in .github/release-drafter.yml combines `filter-by-commitish: true`
# (a release's target_commitish must equal the branch) with `tag-prefix: v`,
# so drafts created on one branch never leak into another.
#
# NOTE: do NOT reintroduce a `filter-by-range: ~MAJOR.MINOR.0` filter here.
# When a release branch has no published release inside its own MAJOR.MINOR
# range (e.g. any newly-cut branch), release-drafter falls back to its default
# version 0.1.0. That 0.1.0 draft does NOT satisfy `~MAJOR.MINOR.0`, so on the
# next run the range filter hides the draft the action itself just created -
# it reports "No draft release found" and creates ANOTHER 0.1.0 draft,
# repeating on every push and flooding the releases page with untagged-*
# drafts. `filter-by-commitish` alone gives full per-branch isolation without
# this failure mode.
#
# Companion config: .github/release-drafter.yml
name: "Release - Drafter"
on:
  # Runs on every push to a release branch so the draft for that branch is
  # always up to date with the latest merged PRs. Feature branches are
  # deliberately excluded: a push to fix/foo used to create a draft release
  # targeting fix/foo, which can never be published.
  push:
    branches:
      - main
      - '[0-9]+.[0-9]+.x'
  # Runs on PRs whose BASE branch is a release branch so the autolabeler can
  # apply labels (bug/feature/docs/...) and the draft picks up new PRs as soon
  # as they are opened. Feature-to-feature PRs (e.g. fix/foo -> feat/bar) are
  # intentionally excluded - they cannot affect any release.
  #
  # NOTE: `pull_request_target` is deliberately NOT used. It ran this workflow
  # a second time for every PR against the same draft, and it grants a
  # write-capable token in the base-repo context to runs triggered by untrusted
  # fork branches - the exact pattern ASF security guidance tells us to avoid.
  # The cost of using plain `pull_request` is that PRs from forks get a
  # read-only token, so neither the autolabeler nor the draft update can run
  # there; both catch up automatically on the `push` event when the PR merges.
  pull_request:
    types: [opened, reopened, synchronize, labeled]
    branches:
      - main
      - '[0-9]+.[0-9]+.x'
  # Manual recovery: rerun against any branch (e.g. to recreate a draft after
  # one was accidentally deleted, or to seed an initial draft on a new branch).
  workflow_dispatch:

# Per-branch concurrency, keyed on the release branch rather than `github.ref`
# so a PR and a push to the same base branch share one queue instead of
# racing to update the same draft.
#
# `cancel-in-progress: true`: if multiple pushes land on the same branch in
# quick succession, only the latest matters - the latest run sees every PR
# the older one would have seen, so cancelling pending runs is correct. This
# also keeps the drafter from accumulating queued runs against GitHub's
# resource limits, which is why the other workflows in this repo queue instead.
concurrency:
  group: release-drafter-${{ github.event.pull_request.base.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  update_release_draft:
    name: "Update Release Draft"
    permissions:
      # Required to create or update the draft GitHub Release
      contents: write
      # Required for the autolabeler to add labels to PRs
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      # Seed an initial version for release branches that have no published
      # release yet (e.g. a freshly cut 1.1.x). release-drafter falls back to
      # its default 0.1.0 when it finds no "last release", which on such a
      # branch produces a misleading v0.1.0 draft. We detect that case and
      # pass the branch's own MAJOR.MINOR.0 as the `version` input so the
      # draft reads e.g. v1.1.0 instead.
      #
      # This is self-correcting: the moment the branch publishes ANY release,
      # the lookup below finds it and we stop seeding, letting release-drafter
      # resolve the next version normally (e.g. 1.1.0 -> 1.1.1). Branches that
      # already have a release (main, 1.0.x) get an empty seed, which
      # release-drafter treats as "no override". `main` is not a MAJOR.MINOR.x
      # branch so it never seeds - correct, since it already has releases.
      # Best-effort: any lookup failure also yields an empty seed.
      - name: "🔢 Seed initial version for release-less branches"
        id: seed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          # No `set -e`: a failed release lookup must degrade to an empty seed,
          # not fail the job. (GitHub invokes `run:` as `bash -e` by default,
          # which would abort at the assignment below before the error handler
          # could run, turning every PR check red on a transient API hiccup.)
          set +e
          set -uo pipefail
          BRANCH="${{ github.event.pull_request.base.ref || github.ref_name }}"
          if [[ ! "$BRANCH" =~ ^([0-9]+)\.([0-9]+)\.x$ ]]; then
            echo "Branch $BRANCH is not a MAJOR.MINOR.x release branch; no version seed."
            echo "version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SEED="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.0"
          # Mirror release-drafter's "last release" lookup: a non-draft release
          # whose target_commitish (with refs/heads/ stripped, as the action
          # does) equals this branch and whose tag starts with the "v" prefix.
          # Prereleases count, matching include-pre-releases: true.
          if ! matches="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq ".[] | select(.draft == false) | select((.target_commitish | sub(\"^refs/heads/\"; \"\")) == \"${BRANCH}\") | select(.tag_name | startswith(\"v\")) | .tag_name" 2>/dev/null)"; then
            echo "::warning title=Version seed skipped::Could not list releases for ${BRANCH}; leaving version unset (release-drafter default)."
            echo "version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          count="$(printf '%s\n' "$matches" | grep -c . || true)"
          if [[ "${count:-0}" -gt 0 ]]; then
            echo "Branch $BRANCH already has $count matching release(s); release-drafter will resolve the next version. No seed."
            echo "version=" >> "$GITHUB_OUTPUT"
          else
            echo "Branch $BRANCH has no published release; seeding initial version $SEED (draft becomes v$SEED instead of v0.1.0)."
            echo "version=$SEED" >> "$GITHUB_OUTPUT"
          fi

      # Pinned by commit SHA per the ASF security policy (matches the pinning
      # convention already used by the other actions in this repo). v7.2.1 or
      # later is required because it ships PR #1593 - the bug fix for
      # `initial-commits-since` being silently ignored when set only in the
      # release-drafter.yml config (not also as a workflow input). Our
      # release-drafter.yml relies on that exact config-only path to bound
      # history walking on brand-new release branches.
      #
      # Earlier minor releases also contributed key options we depend on:
      # - v7.1.0 (PR #1451): adds the `initial-commits-since` config option.
      # - v7.0.0 (PR #1470): adds the `history-limit` config option.
      #
      # Bump checklist: when updating, verify the new tag is signed, read the
      # release notes for any breaking changes to the config schema, and
      # update both the SHA and the `# v...` comment together. Resolve the
      # commit SHA via:
      #   gh api repos/release-drafter/release-drafter/git/tags/<tag-sha> \
      #     --jq '.object.sha'
      - name: "📝 Update Release Draft"
        id: drafter
        uses: release-drafter/release-drafter@34d80673e067bdc0c24568d3af899c216adcfaa9 # v7.7.0
        # Drafting release notes is a best-effort, non-critical task - a
        # transient GitHub API hiccup (or the read-only token handed to a fork
        # PR) must not turn every PR check red. The explicit verification step
        # below catches the case where the action silently produced no draft.
        continue-on-error: true
        with:
          # Explicit `commitish` is critical on `pull_request` events: without
          # it, release-drafter would default to `refs/pull/N/merge` (a
          # virtual ref) which the GitHub API rejects when creating a release,
          # producing the "Validation Failed: target_commitish invalid" error.
          commitish: ${{ github.event.pull_request.base.ref || github.ref_name }}
          # Empty for branches that already have a release (release-drafter
          # treats an empty version as "no override" and resolves the next
          # version itself). On a release-less MAJOR.MINOR.x branch this is
          # MAJOR.MINOR.0 so the draft reads e.g. v1.1.0 instead of v0.1.0.
          version: ${{ steps.seed.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Surface failures that `continue-on-error` would otherwise hide. The
      # release-drafter action exposes the resulting release id as an output;
      # an empty value means it failed to create or update a draft. We log a
      # loud warning (visible in the workflow summary and as a GitHub Actions
      # annotation) but do NOT fail the job - PR checks must stay green for
      # transient API issues and fork PRs, while still alerting maintainers
      # something is wrong if drafts go missing for consecutive runs on a
      # release branch.
      - name: "🔎 Verify draft was created or updated"
        if: always()
        env:
          DRAFT_ID: ${{ steps.drafter.outputs.id }}
          DRAFT_TAG: ${{ steps.drafter.outputs.tag_name }}
          DRAFT_NAME: ${{ steps.drafter.outputs.name }}
          DRAFT_URL: ${{ steps.drafter.outputs.html_url }}
          DRAFT_OUTCOME: ${{ steps.drafter.outcome }}
          BRANCH: ${{ github.event.pull_request.base.ref || github.ref_name }}
        run: |
          set -euo pipefail
          {
            echo "## Release Drafter Result"
            echo ""
            echo "- Branch: \`${BRANCH}\`"
            echo "- Step outcome: \`${DRAFT_OUTCOME}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ -z "${DRAFT_ID:-}" ]]; then
            {
              echo "- Status: ⚠️ **No draft created/updated**"
              echo ""
              echo "release-drafter ran but did not produce a draft release id."
              echo "Common causes: the PR came from a fork (read-only token),"
              echo "the GitHub API rate limit was exhausted, no prior release"
              echo "matched the commitish/tag-prefix filters, or the action"
              echo "errored. Check the previous step's logs."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=Release draft missing::release-drafter produced no draft for branch ${BRANCH}. Step outcome was '${DRAFT_OUTCOME}'. See workflow summary."
          else
            {
              echo "- Status: ✅ Draft maintained"
              echo "- Tag: \`${DRAFT_TAG}\`"
              echo "- Name: ${DRAFT_NAME}"
              echo "- URL: ${DRAFT_URL}"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Draft ${DRAFT_TAG} (id ${DRAFT_ID}) maintained for branch ${BRANCH}: ${DRAFT_URL}"
          fi
